name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build frontend
        working-directory: apps/web
        run: |
          npm ci
          npm run build
          npm test
      - name: Install backend
        working-directory: apps/api
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install '.[test]'
      - name: Check backend
        working-directory: apps/api
        run: .venv/bin/python -m pytest tests -q

  workos-staging:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install backend
        working-directory: apps/api
        run: |
          python3 -m venv .venv
          .venv/bin/pip install '.[test]'
      - name: Verify dedicated WorkOS staging session
        working-directory: apps/api
        env:
          RUN_WORKOS_LIVE: '1'
          WORKOS_TEST_API_KEY: ${{ secrets.WORKOS_TEST_API_KEY }}
          WORKOS_TEST_CLIENT_ID: ${{ vars.WORKOS_TEST_CLIENT_ID }}
        run: .venv/bin/python -m unittest discover -s tests -p test_workos_live.py -v

  deploy:
    if: github.event_name == 'push'
    needs: smoke
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install deployment CLI
        run: npm install --global vercel@63.1.0
      - name: Check deployment configuration
        env:
          HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
        run: |
          test -n "$VERCEL_ORG_ID" || { echo 'Missing VERCEL_ORG_ID variable'; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo 'Missing VERCEL_PROJECT_ID variable'; exit 1; }
          test "$HAS_VERCEL_TOKEN" = true || { echo 'Missing VERCEL_TOKEN repository secret'; exit 1; }
      - name: Deploy both services
        id: deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          args=(--yes)
          if [ "$GITHUB_REF" = 'refs/heads/main' ]; then
            args+=(--prod)
          fi
          vercel deploy "${args[@]}" > "$RUNNER_TEMP/vercel-result.txt"
          DEPLOYMENT_RESULT="$RUNNER_TEMP/vercel-result.txt" node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const result = readFileSync(process.env.DEPLOYMENT_RESULT, 'utf8').trim();
          let value;
          try { value = JSON.parse(result).deployment?.url; }
          catch { value = result; }
          const url = new URL(value);
          if (url.protocol !== 'https:' || !url.hostname.endsWith('.vercel.app') || url.origin !== value) {
            throw new Error('Unexpected Vercel deployment result');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `url=${value}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Deployment: ${value}\n`);
          JS
      - name: Smoke test deployed frontend and backend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deployment.outputs.url }}
        run: |
          set -euo pipefail
          vercel curl / --deployment "$DEPLOYMENT_URL" -- --fail-with-body --silent --show-error > "$RUNNER_TEMP/frontend.html"
          vercel curl /api/health --deployment "$DEPLOYMENT_URL" -- --fail-with-body --silent --show-error > "$RUNNER_TEMP/health.json"
          python3 - "$RUNNER_TEMP/frontend.html" "$RUNNER_TEMP/health.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          assert '<title>PII Guard</title>' in Path(sys.argv[1]).read_text()
          data = json.loads(Path(sys.argv[2]).read_text())
          assert data['status'] == 'ok'
          assert data['service'] == 'pii-guard-api'
          assert data['commit'] == os.environ['GITHUB_SHA']
          print('Deployed frontend and backend verified against pushed commit')
          PY
