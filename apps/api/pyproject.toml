[project]
name = "pii-guard-api"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.142.4",
  "pydantic==2.13.5",
  "uvicorn==0.42.0",
]

[project.optional-dependencies]
test = ["httpx==0.28.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
