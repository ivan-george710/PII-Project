[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-guard-engine"
version = "0.1.0"
description = "Independent PII Guard privacy engine package."
requires-python = ">=3.11"
dependencies = [
    "lxml>=4.9",
    "pillow>=10",
    "presidio-analyzer>=2.2.364,<3",
    "pydantic>=2.0,<3",
    "pymupdf>=1.26.7,<1.28",
    "pypdf>=5",
    "pypdfium2>=5.14,<6",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "regex>=2023.0.0",
]

[project.optional-dependencies]
ocr = [
    "rapidocr-onnxruntime>=1.2",
]
test = [
    "pytest>=8",
    "reportlab>=4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: actual provider/model integration; OCR is opt-in", "presidio: actual Presidio and local spaCy model integration"]
