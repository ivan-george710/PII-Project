[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pii-guard-engine"
version = "0.1.0"
description = "Independent PII Guard privacy engine package."
requires-python = ">=3.11"
dependencies = [
    "lxml>=4.9",
    "opencv-python-headless>=4.10,<5",
    "pillow>=10",
    "presidio-analyzer>=2.2.364,<3",
    "pydantic>=2.0,<3",
    "pymupdf>=1.26.7,<1.28",
    "pypdf>=5",
    "pypdfium2>=5.14,<6",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "regex>=2023.0.0",
]

[project.optional-dependencies]
ocr = [
    "rapidocr==3.10.0",
    "onnxruntime>=1.20,<2",
]
runtime = ["en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"]
test = [
    "pytest>=8",
    "reportlab>=4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: actual provider/model integration; OCR is opt-in", "presidio: actual Presidio and local spaCy model integration"]

[tool.setuptools.package-data]
pii_guard = ["model_assets/*.onnx", "model_assets/*.txt"]
